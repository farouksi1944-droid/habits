<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HabitFlow Sheets - متتبع العادات</title>
    <meta name="description" content="تطبيق ذكي وجميل لتتبع العادات اليومية مع مزامنة سحابية متقدمة على Google Sheets" />
    <meta property="og:title" content="HabitFlow Sheets - متتبع العادات" />
    <meta property="og:description" content="تطبيق ذكي وجميل لتتبع العادات اليومية مع مزامنة سحابية متقدمة على Google Sheets" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HabitFlow" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
      window.__deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPWAInstallPrompt = e;
      });
      try {
        if (localStorage.getItem('habitflow_theme') === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-['Tajawal',sans-serif] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
